<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>MedGuardian AI | Profile</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">

<style>

:root {
    --bg-1: #eef6ff;
    --bg-2: #f0fdf8;
    --bg-3: #fff9f3;
    --panel: rgba(255,255,255,0.92);
    --panel-strong: rgba(255,255,255,0.96);
    --card-border: rgba(191,219,254,0.8);
    --text: #0f172a;
    --muted: #64748b;
    --surface: #f8fafc;
}

body {
margin: 0;
font-family: "Segoe UI", Arial, sans-serif;
background: radial-gradient(circle at top left, rgba(37,99,235,.15), transparent 25%),
            radial-gradient(circle at bottom right, rgba(16,185,129,.12), transparent 30%),
            linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 35%, var(--bg-3) 100%);
color: var(--text);
transition: background 0.25s ease, color 0.25s ease;
}

body[data-theme="dark"] {
    --bg-1: #020817;
    --bg-2: #0f172a;
    --bg-3: #111827;
    --panel: rgba(15,23,42,0.86);
    --panel-strong: rgba(15,23,42,0.96);
    --card-border: rgba(148,163,184,0.18);
    --text: #e2e8f0;
    --muted: #94a3b8;
    --surface: #0b1220;
}

.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 5%;
    background: linear-gradient(135deg, #1d4ed8, #2563eb 38%, #0ea5e9 72%, #10b981);
    color: white;
    box-shadow: 0 15px 35px rgba(37,99,235,.22);
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-icon {
    width: 48px;
    height: 48px;
    border-radius: 15px;
    background: rgba(255,255,255,.18);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    border: 1px solid rgba(255,255,255,.2);
}

.brand h1 {
    font-size: 23px;
    margin: 0;
}

.brand p {
    margin: 3px 0 0;
    font-size: 11px;
    opacity: 0.85;
}

.top-actions {
    display: flex;
    align-items: center;
    gap: 10px;
}

.profile-link,
.logout-btn,
.theme-toggle {
    padding: 10px 15px;
    border-radius: 10px;
    color: white;
    font-weight: 700;
    text-decoration: none;
    border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.12);
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.theme-toggle:hover,
.profile-link:hover,
.logout-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(15,23,42,0.18);
}

.logout-btn {
    background: linear-gradient(135deg, #f59e0b, #ef4444);
}

.profile-container{

    max-width:800px;

    margin:40px auto;
    padding: 0 20px 40px;

}

section.card {
background: var(--panel);
    border-radius: 24px;
    padding: 26px;
border: 1px solid var(--card-border);
    box-shadow: 0 18px 40px rgba(15,23,42,0.06);
}

.profile-header{

    text-align:center;

    margin-bottom:20px;

}

.avatar{

    width:90px;

    height:90px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #0ea5e9
        );

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:40px;

    margin:auto;
    box-shadow: 0 16px 32px rgba(37,99,235,.18);

}

.profile-form{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:15px;

}

.profile-form label{

    display:block;

    font-size:12px;

    font-weight:700;

    margin-bottom:6px;
    color: #334155;

}

.profile-form input,
.profile-form select{

    width:100%;

    padding:13px;

    border:1px solid #dbe3ec;

    border-radius:12px;
background: var(--surface);
color: var(--text);
outline: none;
transition: .2s;
}

.profile-form input:focus,
.profile-form select:focus {
    border-color: #2563eb;
    background: white;
    box-shadow: 0 0 0 4px rgba(37,99,235,.1);
}

.full{

    grid-column:1 / -1;

}

.save-profile{

    background: linear-gradient(135deg, #2563eb, #0ea5e9);

    color:white;

    border:none;

    padding:14px;

    border-radius:12px;

    font-weight:800;

    cursor:pointer;
    box-shadow: 0 12px 26px rgba(37,99,235,.25);

}

.back-btn{

    display:inline-block;

    margin-top:15px;

    padding:11px 16px;

    background: linear-gradient(135deg, #64748b, #94a3b8);

    color:white;

    border-radius:10px;
    text-decoration: none;

}

@media(max-width:600px){

    .profile-form{

        grid-template-columns:1fr;

    }

    .full{

        grid-column:auto;

    }

    .topbar {
        flex-direction: column;
        gap: 12px;
        text-align: center;
    }

    .top-actions {
        width: 100%;
        justify-content: center;
    }

}

</style>

</head>


<body>


<header class="topbar">

    <div class="brand">

        <div class="brand-icon">
            🌿
        </div>

        <div>

            <h1>
                MedGuardian AI
            </h1>

            <p>
                Patient Profile
            </p>

        </div>

    </div>


    <div class="top-actions">

        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
            🌙 Dark
        </button>

        <a
            href="/"
            class="profile-link">

            🏠 Dashboard

        </a>

        <a
            href="/logout"
            class="logout-btn">

            Logout

        </a>

    </div>

</header>


<div class="profile-container">


<section class="card">

    <div class="profile-header">

        <div class="avatar">
            👤
        </div>

        <h2>
            Patient Profile
        </h2>

        <p>
            Manage your personal healthcare information.
        </p>

    </div>


    <form
        action="/update-profile"
        method="POST"
        class="profile-form">


        <div class="full">

            <label>
                Full Name
            </label>

            <input
                type="text"
                name="name"
                value="{{ patient['name'] }}"
                required>

        </div>


        <div>

            <label>
                Email
            </label>

            <input
                type="email"
                value="{{ patient['email'] }}"
                disabled>

        </div>


        <div>

            <label>
                Phone
            </label>

            <input
                type="text"
                name="phone"
                value="{{ patient['phone'] or '' }}"
                placeholder="Phone number">

        </div>


        <div>

            <label>
                Age
            </label>

            <input
                type="number"
                name="age"
                min="1"
                max="120"
                value="{{ patient['age'] or '' }}"
                placeholder="Age">

        </div>


        <div>

            <label>
                Gender
            </label>

            <select name="gender">

                <option value="">
                    Select gender
                </option>

                <option
                    value="Male"
                    {% if patient['gender'] == 'Male' %}selected{% endif %}>
                    Male
                </option>

                <option
                    value="Female"
                    {% if patient['gender'] == 'Female' %}selected{% endif %}>
                    Female
                </option>

                <option
                    value="Other"
                    {% if patient['gender'] == 'Other' %}selected{% endif %}>
                    Other
                </option>

            </select>

        </div>


        <div class="full">

            <button
                type="submit"
                class="save-profile">

                💾 Save Profile

            </button>

        </div>

    </form>


    <a
        href="/"
        class="back-btn">

        ← Back to Dashboard

    </a>

</section>

</div>

<script>
    function applyTheme(theme) {
        document.body.setAttribute("data-theme", theme);
        const toggle = document.getElementById("themeToggle");
        if (toggle) {
            toggle.textContent = theme === "dark" ? "☀️ Light" : "🌙 Dark";
            toggle.setAttribute("aria-label", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
        }
        try {
            localStorage.setItem("medguardian-theme", theme);
        } catch (error) {
            console.warn("Theme preference could not be saved.", error);
        }
    }

    const savedTheme = (() => {
        try {
            const stored = localStorage.getItem("medguardian-theme");
            if (stored === "dark" || stored === "light") return stored;
        } catch (error) {
            console.warn("Theme preference could not be read.", error);
        }
        return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    })();

    applyTheme(savedTheme);

    document.getElementById("themeToggle")?.addEventListener("click", () => {
        const nextTheme = document.body.getAttribute("data-theme") === "dark" ? "light" : "dark";
        applyTheme(nextTheme);
    });
</script>

</body>

</html>
